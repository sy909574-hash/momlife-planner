:root{--g:#8f6165;--g2:#b89a96;--c:#c98f86;--m:#d3b98a;--t:#9aa88f;--p:#a98aa0;--bg:#f6f1e8;--card:#fffdf9;--ink:#4a3b3b;--mute:#8a7c78;--line:#e8dfd3;--r:16px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.5 "Avenir Next",Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
h1,h2,h3,.num{font-family:"Playfair Display",Georgia,serif}
nav{width:220px;background:var(--g);color:#e9efe9;padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
nav .logo{font:600 20px Georgia,serif;padding:0 10px 18px}
nav .logo small{display:block;font:12px sans-serif;opacity:.7}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer}
nav button:hover{background:#ffffff14}nav button.on{background:#ffffff26;font-weight:600}
main{flex:1;padding:26px 28px;max-width:1000px}
main>h2{font-size:28px}main>p.sub{color:var(--mute);margin-bottom:18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:0 1px 8px #2f4a3f12}
.card h3{font-size:15px;margin-bottom:10px}
.stat .num{font-size:34px;line-height:1.1}.stat span{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;flex:1;min-width:90px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
.btn:hover{background:var(--g2)}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item.done span{text-decoration:line-through;color:var(--mute)}
.item span{flex:1}.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px}
input[type=checkbox]{flex:none;min-width:0;width:20px;height:20px;accent-color:var(--g)}
.hab{display:grid;grid-template-columns:1fr repeat(7,34px);gap:6px;align-items:center;padding:6px 0}
.hab b{font-weight:500}.hab small{text-align:center;color:var(--mute)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer}
.dot.on{background:var(--g2);border-color:var(--g2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.moods button{font-size:26px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 10px;cursor:pointer}
.moods button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
svg{max-width:100%;height:auto}
.empty{color:var(--mute);padding:8px 0}
nav{overflow-y:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}.cal small{text-align:center;color:var(--mute)}
.cell{min-height:58px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:11px;overflow:hidden}.cell.now{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.cell em{display:block;font-style:normal;color:var(--g2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--g2)}
.meal{display:grid;grid-template-columns:44px repeat(3,1fr);gap:6px;align-items:center;margin-bottom:6px}.meal input{min-width:0;padding:7px 8px;font-size:13px}.meal small{color:var(--mute);text-align:center}
textarea{font-size:16px;width:100%;min-height:300px;font:inherit;padding:14px;border:1px solid var(--line);border-radius:12px;resize:vertical}
.paid{opacity:.55}
#cover{position:fixed;inset:0;z-index:50;background:var(--cov) center 55%/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3.5vh,36px);padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);overflow:hidden}
#cover .logo{display:block;width:min(94vw,920px,calc(44vh*2.16));height:auto}
#cover .go{border:0;background:none;padding:0;cursor:pointer;transition:transform .2s;filter:drop-shadow(0 6px 10px #6b45483d)}
#cover .go img{display:block;width:min(60vw,400px,calc(13vh*3.57));height:auto}
#cover .go:hover{transform:scale(1.04)}#cover .go:focus-visible{outline:3px solid #fff;outline-offset:6px;border-radius:999px}
@media(max-width:760px){nav{overflow-x:auto;overflow-y:hidden}nav button{flex:none;width:auto;padding:8px 12px;white-space:nowrap}}
input[type=color]{flex:none;min-width:0;width:48px;height:36px;padding:2px;cursor:pointer}
.preset{display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;color:var(--ink);cursor:pointer}.preset i{width:16px;height:16px;border-radius:50%}
@media(max-width:760px){body{flex-direction:column-reverse}
nav{width:auto;height:auto;position:fixed;top:auto;left:0;right:0;bottom:0;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}nav .logo{display:none}
nav button{text-align:center;padding:8px 2px;font-size:12px}main{padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(90px + env(safe-area-inset-bottom,0px))}.hab{grid-template-columns:1fr repeat(7,28px);gap:3px}.dot{width:26px;height:26px}}
</style>
</head>

function today(){return (new Date().getDay()+6)%7}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function spent(){return S.exp.reduce(function(a,e){return a+e.a},0)}
function byCat(){return CATS.map(function(c){return S.exp.filter(function(e){return e.c==c[0]}).reduce(function(a,e){return a+e.a},0)})}
function careScore(){var c=S.care,s=Math.min(c.sleep/8,1)*30+Math.min(c.water/8,1)*30+Math.min(c.me/60,1)*30+(S.mood!==null?10:0);return Math.round(s)}
function donut(vals,cols,center,sub){
  var tot=vals.reduce(function(a,b){return a+b},0),r=48,C=2*Math.PI*r,off=0,h="";
  if(!tot)h='<circle cx="70" cy="70" r="48" fill="none" style="stroke:var(--line)" stroke-width="20"/>';
  else vals.forEach(function(v,i){var l=v/tot*C;h+='<circle cx="70" cy="70" r="48" fill="none" style="stroke:'+cols[i]+'" stroke-width="20" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';off+=l});
  return '<svg viewBox="0 0 140 140" width="150"><g>'+h+'</g><text x="70" y="72" text-anchor="middle" font-family="Georgia" font-size="22" style="fill:var(--ink)">'+center+'</text><text x="70" y="88" text-anchor="middle" font-size="10" style="fill:var(--mute)">'+sub+'</text></svg>';
}
function line(vals){
